name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: dom, json, pdo, sqlite, gd, fileinfo
          coverage: none

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Generated JS and CSS cache
        id: js-and-css-cache
        uses: actions/cache@v6
        with:
          path: dist/**
          key: ${{ runner.os }}-js-and-css-${{ hashFiles('**/package-lock.json', '**/resources/{.js,scss}') }}

      - name: Generate front-end files
        if: steps.js-and-css-cache.outputs.cache-hit != 'true'
        run: npm run build

      - name: Run checks
        run: composer test-ci-checks

  tests:
    name: P${{ matrix.php }}
    needs: checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [8.3, 8.4]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, json, pdo, sqlite, gd, fileinfo
          coverage: none

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Generated JS and CSS cache
        id: js-and-css-cache
        uses: actions/cache@v6
        with:
          path: dist/**
          key: ${{ runner.os }}-js-and-css-${{ hashFiles('**/package-lock.json', '**/resources/{.js,scss}') }}

      - name: Generate front-end files
        if: steps.js-and-css-cache.outputs.cache-hit != 'true'
        run: npm run build

      - name: Run tests
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
        run: composer test-ci-tests
